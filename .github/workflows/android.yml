name: Android
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up missing runner dependencies
        uses: ./.github/actions/setup-runner
        with:
          android: 'true'
      - name: Test release and signing tools
        run: python3 -m unittest discover -s tests
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Prepare optional persistent debug signing
        if: github.event_name == 'push'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: python3 scripts/debug_signing.py
      - name: Test and build APKs
        env:
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: ./gradlew testCoreDebugUnitTest testVideoDebugUnitTest lintCoreDebug lintVideoDebug assembleCoreDebug assembleVideoDebug assembleCoreRelease assembleVideoRelease verifyVideoReleaseZipHandlers
      - name: Upload private APK artifacts
        if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/s3-artifacts
        env:
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        with:
          artifacts: middleshare-core-debug middleshare-video-debug
      - name: Remove debug signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/middleshare-debug.jks"
