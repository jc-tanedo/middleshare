name: Artifact retention
on:
  workflow_run:
    workflows: ['Android', 'Release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: artifact-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run can follow a PR: run only trusted default-branch cleanup code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up missing runner dependencies
        uses: ./.github/actions/setup-runner
      - name: Keep the two newest versions of each APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/prune_artifacts.py --apply
