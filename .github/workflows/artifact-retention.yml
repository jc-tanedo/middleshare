name: Artifact retention
on:
  workflow_run:
    workflows: ['Android', 'Release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: artifact-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run can follow a PR: run only trusted default-branch cleanup code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Keep the two newest versions of each APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/prune_artifacts.py --apply
