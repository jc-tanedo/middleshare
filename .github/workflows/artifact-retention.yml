name: Artifact retention
on:
  workflow_run:
    workflows: ['Android', 'Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Maintain artifacts, refresh download links, or test the private storage.
        type: choice
        default: cleanup
        options: [cleanup, download-links, test-storage]
permissions:
  contents: read
  actions: write
concurrency:
  group: artifact-retention
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run can follow a PR: run only trusted default-branch cleanup code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up missing runner dependencies
        uses: ./.github/actions/setup-runner
      - name: Keep the two newest versions of each APK artifact
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/prune_artifacts.py --apply
      - name: Maintain private artifact storage
        uses: ./.github/actions/s3-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        with:
          command: ${{ inputs.operation == 'test-storage' && 'probe' || inputs.operation == 'download-links' && 'links' || 'prune' }}
