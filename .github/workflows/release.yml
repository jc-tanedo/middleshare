name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up missing runner dependencies
        uses: ./.github/actions/setup-runner
        with:
          android: 'true'
      - name: Test release and signing tools
        run: python3 -m unittest discover -s tests
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/release.py signing
      - name: Test and build signed APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/middleshare-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testCoreDebugUnitTest testVideoDebugUnitTest lintCoreDebug lintVideoDebug assembleCoreRelease assembleVideoRelease verifyVideoReleaseZipHandlers
      - name: Collect and verify release APKs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py collect
      - name: Archive release APKs in private S3 storage (optional)
        uses: ./.github/actions/s3-artifacts
        # Publishing below uploads the same verified files directly to GitHub Releases.
        continue-on-error: true
        env:
          S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        with:
          artifacts: release-apks
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py publish
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/middleshare-release.jks"
