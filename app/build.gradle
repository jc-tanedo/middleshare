plugins { id 'com.android.application' }

android {
    namespace 'dev.middleshare'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.middleshare'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '0.6.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'features'
    productFlavors {
        core {
            dimension 'features'
            buildConfigField 'boolean', 'VIDEO_TOOLS', 'false'
        }
        video {
            dimension 'features'
            applicationIdSuffix '.video'
            buildConfigField 'boolean', 'VIDEO_TOOLS', 'true'
            resValue 'string', 'app_name', 'MiddleShare Video'
        }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs.useLegacyPackaging = true }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    videoImplementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    videoImplementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

apply from: rootProject.file('gradle/third-party.gradle')
